<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="description" content="Competitive-programming style study cases in Python, graded in your browser.">
<title>Arena | Pit Wall ML</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <aside class="sidenav" id="sidenav"></aside>
  <div class="content">
    <header class="pagehead" id="pagehead"></header>
    <div class="two-col">
      <main id="main" class="main-col" tabindex="-1">
        <section id="auth" class="card" hidden></section>
        <section id="list" class="card" hidden>
          <h2 id="listTitle"></h2>
          <p class="muted" id="listIntro"></p>
          <div class="chips" id="tierFilter" role="group"></div>
          <ul class="list" id="problemList"></ul>
        </section>
        <section id="work" hidden>
          <div class="card">
            <div class="row"><span class="tier" id="wTier"></span><span class="muted" id="wModule"></span></div>
            <h2 id="wTitle"></h2>
            <div class="statement" id="wStatement"></div>
          </div>
          <div class="card">
            <label class="field"><span id="wCodeLabel"></span><textarea id="wCode" class="editor" spellcheck="false" autocapitalize="none" autocomplete="off"></textarea></label>
            <div class="actions">
              <button class="btn" id="runBtn" type="button"></button>
              <button class="btn secondary" id="hintBtn" type="button"></button>
              <button class="btn secondary" id="indentBtn" type="button">Indent</button>
              <button class="btn secondary" id="resetCodeBtn" type="button"></button>
              <button class="btn secondary" id="solutionBtn" type="button" hidden></button>
            </div>
            <p class="muted" id="runStatus" role="status" aria-live="polite"></p>
            <div id="results"></div>
            <div id="hints"></div>
            <div id="editorial" hidden></div>
          </div>
        </section>
      </main>
      <section class="card" id="pit"></section>
      <aside class="rail">

      </aside>
    </div>
  </div>
</div>
<script src="/engine.js" defer></script>
<script src="/nav.js" defer></script>
<script src="/shell.js" defer></script>
<script src="/personas.js" defer></script>
<script src="/headshots.js" defer></script>
<script src="/moderators.js" defer></script>
<script src="/coach.js" defer></script>
<script src="/bank/tips.js" defer></script>
<script src="/catalog.js" defer></script>
<script src="/problems.js" defer></script>
<script src="/vendor/katex/katex.min.js" defer></script>
<script src="/config.js" defer></script>
<script src="/usernames.js" defer></script>
<script src="/backend.js" defer></script>
<script src="/app.js" defer></script>
<script src="/pit.js" defer></script>
<script src="/arena-runner.js" defer></script>
<script src="/arena-page.js" defer></script>
</body>
</html>
